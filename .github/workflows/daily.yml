name: Render scheduled lesson

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/daily-lesson.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: java-full-stack-daily
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check renderer
        run: npm run typecheck

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Render scheduled ChatGPT lesson
        run: npm run render:scheduled

      - name: Preserve generated site for deployment
        run: |
          rm -rf "$RUNNER_TEMP/generated-site"
          mkdir -p "$RUNNER_TEMP/generated-site"
          cp -R docs/. "$RUNNER_TEMP/generated-site/"

          # The generated PNGs/site are deployment output, not repository history.
          # Restore tracked docs and remove generated untracked files before committing history.
          git restore docs
          git clean -fd docs

      - name: Persist lesson history
        run: |
          git config user.name "java-full-stack-daily[bot]"
          git config user.email "java-full-stack-daily[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: record lesson $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/generated-site

  deploy:
    needs: render
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
