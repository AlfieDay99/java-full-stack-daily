name: Generate daily lesson

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"
      timezone: "Europe/London"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: java-full-stack-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Generate lesson and cards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
        run: npm run generate

      - name: Commit generated lesson
        run: |
          git config user.name "java-full-stack-daily[bot]"
          git config user.email "java-full-stack-daily[bot]@users.noreply.github.com"

          git add docs data/history.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: generate daily lesson $(date -u +%F)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
